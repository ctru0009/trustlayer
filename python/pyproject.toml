[build-system]
# Pinned so a fresh clone builds the same way years from now.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "trustlayer"
version = "0.1.0"
description = "Private multimodal search with sensitivity labelling and permission-aware retrieval (learning project)."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = []

# Phase 2 pins PySpark here so its Java requirement is a deliberate, recorded
# decision rather than an accident. Install with: uv sync --extra spark
[project.optional-dependencies]
spark = ["pyspark==4.1.3"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trustlayer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
