[build-system]
# Pinned so a fresh clone builds the same way years from now.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "trustlayer"
version = "0.1.0"
description = "Private multimodal search with sensitivity labelling and permission-aware retrieval (learning project)."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = []

# Phase 2 pins PySpark here so its Java requirement is a deliberate, recorded
# decision rather than an accident. Install with: uv sync --extra spark
[project.optional-dependencies]
spark = ["pyspark==4.1.3"]
# Phase 4 pins the embedding stack: sentence-transformers (prompts, pooling,
# norm), transformers (native embedding_gemma2, needs >=5.19), torch (MPS),
# psycopg (pgvector load), pillow+numpy (image path). Install with:
# uv sync --extra embed
embed = [
    "numpy==2.3.5",
    "pillow==12.0.0",
    "psycopg[binary]==3.3.2",
    "sentence-transformers==6.1.0",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers==5.19.0",
]
# Phase 7 pins the classifier-comparison stack: scikit-learn (LR on frozen
# embeddings) + mediapipe (Decision Maker Laya row). Transformer-backed rows
# (DistilBERT fine-tune, Gemma zero-shot) reuse the embed extra. Install with:
# uv sync --extra classify
classify = [
    "mediapipe==1.1.0",
    "scikit-learn==1.9.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trustlayer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# E/F: errors and pyflakes. I: import sorting. UP: py312 idioms. B: bugbear
# bug patterns. SIM/C4: simplifications. PTH: pathlib over os.path.
# TID: tidy imports. Q: quote style. S: bandit security. D: docstrings.
# C901: complexity gate. S and D are relaxed for tests below.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "TID", "Q", "S", "D", "C901"]
# D203/D211 and D212/D213 are mutually exclusive pairs; ignore one side
# (D203, D213) so `make lint` stays warning-free.
ignore = ["D203", "D213"]

[tool.ruff.lint.mccabe]
# Ruff flags complexity *above* the max, so 40 means 41+ fails (40 is fine).
max-complexity = 40

[tool.ruff.lint.per-file-ignores]
# Pytest idioms: plain assert and undocumented test functions are fine.
"tests/**" = ["S101", "D"]
